name: 'Deploy Tool'
description: 'Deploy an internal tool to the Linode server via SSH'
author: 'Alpha Omega Team'

inputs:
  tool-name:
    description: 'Name of the tool (e.g., n8n, calcom)'
    required: true
  server-path:
    description: 'Path to tool on server (e.g., ~/tools/n8n)'
    required: true
  health-url:
    description: 'URL to check for health after deployment'
    required: true
  build:
    description: 'Run docker compose build before up (for custom images)'
    required: false
    default: 'false'
  restart-on-change:
    description: >-
      Extended-regex (grep -E) matched against files changed by this deploy.
      When it matches, the services in `restart-services` are explicitly
      `docker compose restart`ed after `up -d`. Use for config-only changes
      (e.g. Grafana provisioning, Caddyfile) that a bind-mount does not
      recreate the container for and which the service only reads at startup.
      Empty (default) disables this step entirely.
    required: false
    default: ''
  restart-services:
    description: >-
      Space-separated compose service names to restart when
      `restart-on-change` matches (e.g. "grafana"). Ignored if
      `restart-on-change` is empty.
    required: false
    default: ''
  tailscale-oauth-client-id:
    description: >-
      Opt-in: join the tailnet as a short-lived `tag:ci` node and SSH to
      `tailscale-ssh-host` instead of SSH_HOST. Tailscale OAuth client ID
      (scope auth_keys, tag:ci) or OIDC federated identity client ID.
      Empty (default) keeps the old public-SSH path.
    required: false
    default: ''
  tailscale-oauth-secret:
    description: 'Tailscale OAuth client secret (omit when using OIDC with tailscale-audience).'
    required: false
    default: ''
  tailscale-audience:
    description: 'Tailscale OIDC federated identity audience (the caller job needs `permissions: id-token: write`).'
    required: false
    default: ''
  tailscale-ssh-host:
    description: 'Tailnet address of the server (used only when tailscale-oauth-client-id is set).'
    required: false
    default: '100.118.68.8'

runs:
  using: 'composite'
  steps:
    - name: Join tailnet (tag:ci)
      if: ${{ inputs.tailscale-oauth-client-id != '' }}
      # tailscale/github-action v4.4.0, pinned by commit
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
      with:
        oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
        oauth-secret: ${{ inputs.tailscale-oauth-secret }}
        audience: ${{ inputs.tailscale-audience }}
        tags: tag:ci
        ping: ${{ inputs.tailscale-ssh-host }}

    - name: Deploy to server
      shell: bash
      env:
        TOOL_NAME: ${{ inputs.tool-name }}
        SERVER_PATH: ${{ inputs.server-path }}
        HEALTH_URL: ${{ inputs.health-url }}
        BUILD: ${{ inputs.build }}
        RESTART_ON_CHANGE: ${{ inputs.restart-on-change }}
        RESTART_SERVICES: ${{ inputs.restart-services }}
        TS_SSH_HOST: ${{ inputs.tailscale-oauth-client-id != '' && inputs.tailscale-ssh-host || '' }}
      run: ${{ github.action_path }}/deploy.sh
