name: 'Deploy Tool'
description: 'Deploy an internal tool to the Linode server via SSH'
author: 'Alpha Omega Team'

inputs:
  tool-name:
    description: 'Name of the tool (e.g., n8n, calcom)'
    required: true
  server-path:
    description: 'Path to tool on server (e.g., ~/tools/n8n)'
    required: true
  health-url:
    description: 'URL to check for health after deployment'
    required: true
  build:
    description: 'Run docker compose build before up (for custom images)'
    required: false
    default: 'false'
  restart-on-change:
    description: >-
      Extended-regex (grep -E) matched against files changed by this deploy.
      When it matches, the services in `restart-services` are explicitly
      `docker compose restart`ed after `up -d`. Use for config-only changes
      (e.g. Grafana provisioning, Caddyfile) that a bind-mount does not
      recreate the container for and which the service only reads at startup.
      Empty (default) disables this step entirely.
    required: false
    default: ''
  restart-services:
    description: >-
      Space-separated compose service names to restart when
      `restart-on-change` matches (e.g. "grafana"). Ignored if
      `restart-on-change` is empty.
    required: false
    default: ''
  tailnet:
    description: >-
      'true' = join the tailnet as a short-lived `tag:ci` node (GitHub OIDC,
      no secret) and SSH to `tailscale-ssh-host` instead of SSH_HOST. The
      caller job needs `permissions: { id-token: write, contents: read }`.
      Only `main` branches of alphaomegateam repos can join (federated
      identity subject `repo:alphaomegateam/*:ref:refs/heads/main`).
    required: false
    default: 'false'
  tailscale-authkey:
    description: >-
      Pre-signed, reusable, ephemeral tag:ci auth key (pass
      `secrets.TS_CI_AUTHKEY`, an org secret). Required once Tailnet Lock is
      on: a locked tailnet does not accept OIDC/OAuth-created nodes. When it
      is set, it is used instead of OIDC. Rotated by the M4 job
      `tailscale-ci-key-rotate` (alphaomega scripts/).
    required: false
    default: ''
  tailscale-oauth-client-id:
    description: 'Federated identity (or OAuth) client ID. Not a secret.'
    required: false
    default: 'TbMv9UXgdr11CNTRL-kTjbcbLzBJ11CNTRL'
  tailscale-audience:
    description: 'Federated identity audience. Not a secret.'
    required: false
    default: 'api.tailscale.com/TbMv9UXgdr11CNTRL-kTjbcbLzBJ11CNTRL'
  tailscale-oauth-secret:
    description: 'Only for an OAuth client instead of OIDC (then set tailscale-audience to empty).'
    required: false
    default: ''
  tailscale-ssh-host:
    description: 'Tailnet address of the server (aot).'
    required: false
    default: '100.118.68.8'

runs:
  using: 'composite'
  steps:
    - name: Join tailnet (tag:ci, pre-signed auth key)
      if: ${{ inputs.tailnet == 'true' && inputs.tailscale-authkey != '' }}
      # tailscale/github-action v4.4.0, pinned by commit
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
      with:
        authkey: ${{ inputs.tailscale-authkey }}
        # Tailnet Lock: the client keeps the key authority state here.
        statedir: ${{ runner.temp }}/tailscale-state
        ping: ${{ inputs.tailscale-ssh-host }}

    - name: Join tailnet (tag:ci, OIDC)
      if: ${{ inputs.tailnet == 'true' && inputs.tailscale-authkey == '' }}
      # tailscale/github-action v4.4.0, pinned by commit
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
      with:
        oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
        oauth-secret: ${{ inputs.tailscale-oauth-secret }}
        audience: ${{ inputs.tailscale-audience }}
        tags: tag:ci
        ping: ${{ inputs.tailscale-ssh-host }}

    - name: Deploy to server
      shell: bash
      env:
        TOOL_NAME: ${{ inputs.tool-name }}
        SERVER_PATH: ${{ inputs.server-path }}
        HEALTH_URL: ${{ inputs.health-url }}
        BUILD: ${{ inputs.build }}
        RESTART_ON_CHANGE: ${{ inputs.restart-on-change }}
        RESTART_SERVICES: ${{ inputs.restart-services }}
        TS_SSH_HOST: ${{ inputs.tailnet == 'true' && inputs.tailscale-ssh-host || '' }}
      run: ${{ github.action_path }}/deploy.sh
